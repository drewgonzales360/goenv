name: release

# Runs when a version tag is pushed, e.g. `git tag v0.5.0 && git push origin v0.5.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tag matches SEMVER in the Makefile
        run: |
          makefile_version="$(sed -n 's/^SEMVER=//p' Makefile)"
          if [[ "${GITHUB_REF_NAME}" != "${makefile_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match SEMVER=${makefile_version} in the Makefile. Bump SEMVER, run 'make readme', commit, and re-tag."
            exit 1
          fi

      - name: README is up to date
        run: |
          make readme
          if ! git diff --exit-code README.md; then
            echo "::error::README.md is out of date. Run 'make readme', commit the result, and re-tag."
            exit 1
          fi

      - name: Build and test
        run: |
          go build ./...
          go test ./...

  publish:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release tarballs
        run: |
          mkdir -p tmp
          GOOS=linux  GOARCH=amd64 make tar
          GOOS=linux  GOARCH=arm64 make tar
          GOOS=darwin GOARCH=amd64 make tar
          GOOS=darwin GOARCH=arm64 make tar

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" tmp/goenv-*-*-"${GITHUB_REF_NAME}".tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
